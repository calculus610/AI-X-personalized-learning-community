events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;

    upstream personalized_frontend {
        server frontend:3402;
    }

    upstream personalized_api {
        server api:3300;
    }

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        client_max_body_size 14m;

        location = / {
            return 302 /personalized-secure;
        }

        location = /personalized-secure {
            proxy_pass http://personalized_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            sub_filter_once on;
            sub_filter '</body>' '<script src="/personalized-secure/platform-enhance.js?v=local-docker-v1"></script><script src="/personalized-secure/f007-agent-shell.js?v=local-docker-v1"></script><script src="/personalized-secure/f007-quiz-shell.js?v=local-docker-v1"></script><script src="/personalized-secure/course-interest-shell.js?v=local-docker-v1"></script><script src="/personalized-secure/loading-guard.js?v=local-docker-v1"></script></body>';
        }

        location /personalized-secure/_next/static/ {
            proxy_pass http://personalized_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~ ^/personalized-secure/(platform-enhance|course-interest-shell|f007-agent-shell|f007-quiz-shell|loading-guard)\.js$ {
            proxy_pass http://personalized_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location /personalized-secure/ {
            proxy_pass http://personalized_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            sub_filter_once on;
            sub_filter '</body>' '<script src="/personalized-secure/platform-enhance.js?v=local-docker-v1"></script><script src="/personalized-secure/f007-agent-shell.js?v=local-docker-v1"></script><script src="/personalized-secure/f007-quiz-shell.js?v=local-docker-v1"></script><script src="/personalized-secure/course-interest-shell.js?v=local-docker-v1"></script><script src="/personalized-secure/loading-guard.js?v=local-docker-v1"></script></body>';
        }

        location = /personalized-secure-api {
            return 301 /personalized-secure-api/;
        }

        location /personalized-secure-api/ {
            proxy_pass http://personalized_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /_vercel/insights/script.js {
            return 204;
        }
    }
}
